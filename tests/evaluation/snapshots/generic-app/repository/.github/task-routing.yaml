model: jev-1.13.0
skip_below: 0.05
tasks:
  unit:
    description: Verify pure string normalization and collection behavior in the library, including compatibility tests. Browser components, SQL migrations, API specifications and generated clients are outside this task.
    jobs:
      - workflow: .github/workflows/checks.yml
        job: unit
      - workflow: .github/workflows/checks.yml
        job: unit-compat
    context_files: [library/test-scope.md]
  ui:
    description: Verify browser component interactions, accessibility and visual styling in the web application. Pure library helpers, SQL migrations and API schema validation are outside this task.
    jobs:
      - workflow: .github/workflows/ui.yml
    context_files: [web/playwright.config.mjs]
  schema:
    description: Verify SQL schemas, migration execution, indexes and database constraints. Pure library behavior, browser styling and API documentation are outside this task.
    jobs:
      - workflow: .github/workflows/checks.yml
        job: schema
    context_files: [db/check-scope.md]
  api:
    description: Verify the API specification and generated TypeScript client agree, including request and response shapes. Pure library tests, browser styling and SQL migration checks are outside this task.
    jobs:
      - workflow: .github/workflows/checks.yml
        job: api
    context_files: [api/check-scope.md]
