name: jev-ci-selector
description: Produce a conservative CI task selection plan using deterministic rules and Jev.
inputs:
  config:
    description: Repository-relative catalog path (read from the PR base commit).
    default: .github/ci-selector.yml
  mode:
    description: shadow preserves all effective tasks; enforce applies the proposal.
    default: shadow
  github-token:
    description: Read-only GitHub token for fetching immutable Git objects.
    default: ${{ github.token }}
  api-key:
    description: Bearer key for the configured Jev API; absence bypasses semantic selection.
    default: ''
  api-base-url:
    description: HTTPS API root before /v1/systemone, without credentials, query or fragment.
    default: https://api.typesafe.ai
  api-model:
    description: Model identifier sent to the API; defaults to the catalog's expected model version.
    default: ''
  allow-external-context:
    description: Explicit permission to send the diff and metadata to the configured API.
    default: 'false'
  force-all:
    description: Bypass optimization immediately.
    default: 'false'
  timeout-ms:
    description: Maximum Jev request duration, without retries.
    default: '10000'
  max-diff-bytes:
    description: Maximum complete UTF-8 diff size; not a token count.
    default: '65536'
# Every catalog task also publishes a dynamic output named after its ID.
# Values are the effective 'true'/'false' strings (all true in shadow/bypass/fallback).
outputs:
  run:
    description: JSON map from every catalog task ID to its effective boolean.
  selected:
    description: JSON array of effective task IDs in stable order.
  matrix:
    description: JSON include matrix of effective task IDs.
  has-tasks:
    description: The string true or false, for a job condition before matrix expansion.
  status:
    description: planned, bypassed, or fallback.
  tested-sha:
    description: Immutable commit the consumers must test.
  report-path:
    description: Local path of the source-free JSON report.
runs:
  using: node24
  main: dist/index.js
