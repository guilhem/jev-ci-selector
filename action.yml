name: jev-ci-selector
description: Select CI tasks from their verification scope using deterministic rules and Jev.
branding:
  icon: filter
  color: purple
inputs:
  tasks:
    description: YAML mapping of task IDs to objects with a description and optional jobs, context_files, resolve_context_files, always and force_paths.
    required: true
  model:
    description: Canonical Jev model version expected in the response.
    default: jev-1.13.0
  mode:
    description: shadow preserves all effective tasks; enforce applies the proposal.
    default: enforce
  tested-ref:
    description: Commit tested by the consumer; merge uses the tested merge commit and head uses the PR head with a verified merge-base diff.
    default: merge
  pull-request:
    description: For workflow_dispatch, evaluate this open PR using metadata at the selected workflow commit. Requires pull-requests read permission.
    default: ''
  github-token:
    description: Read-only GitHub token for fetching immutable Git objects.
    default: ${{ github.token }}
  api-key:
    description: Bearer key for the configured Jev API; absence bypasses semantic selection.
    default: ''
  api-base-url:
    description: HTTPS API root before /v1/systemone, without credentials, query or fragment.
    default: https://api.typesafe.ai
  api-model:
    description: Model identifier sent to the API; defaults to the canonical model input. The response must still identify the canonical version.
    default: ''
  allow-external-context:
    description: Explicit permission to send the diff and metadata to the configured API.
    default: 'false'
  force-all:
    description: Bypass optimization immediately.
    default: 'false'
  timeout-ms:
    description: Deadline for context preparation and analysis together. 0 means none, leaving the job's own timeout-minutes to bound the run; a step killed that way publishes no report, so set this if you want a graceful fallback instead.
    default: '0'
  max-collected-patch-bytes:
    description: Optional ceiling on patch bytes received from Git, rejected and retried attempts included. 0 means none. Replaces max-diff-bytes, which bounded a complete diff this action no longer builds. Not a token count.
    default: '0'
  max-analysis-bytes:
    description: Optional ceiling on complete request JSON sent to the API, preparation and observation together. 0 means none. When set, half is reserved for preparation. Not a token count.
    default: '0'
  max-jev-calls:
    description: Optional ceiling on API calls dispatched for one run, failures included. 0 means none. When set, half is reserved for context preparation, so resolve_context_files then needs at least 2.
    default: '0'
# Every task also publishes a dynamic output named after its ID.
# Values are the effective 'true'/'false' strings (all true in shadow/bypass/fallback).
outputs:
  run:
    description: JSON map from every task ID to its effective boolean.
  selected:
    description: JSON array of effective task IDs in stable order.
  matrix:
    description: JSON include matrix of effective task IDs.
  has-tasks:
    description: The string true or false, for a job condition before matrix expansion.
  status:
    description: planned, bypassed, or fallback.
  tested-sha:
    description: Immutable commit the consumers must test.
  report-path:
    description: Local path of the source-free JSON report.
runs:
  using: node24
  main: dist/index.js
