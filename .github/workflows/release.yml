name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Validate the tagged release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          case "$RELEASE_TAG" in
            "v$version"|"v$version-"*) ;;
            *) echo "Tag $RELEASE_TAG does not match package version $version" >&2; exit 1 ;;
          esac
          npm run check

  release:
    needs: validate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          version="${version%%-*}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]( |$)" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=(release create "$RELEASE_TAG" --verify-tag --title "jev-ci-selector $RELEASE_TAG" --notes-file release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then args+=(--prerelease); fi
          gh "${args[@]}"
      # A prerelease keeps its exact tag: moving the floating major tag here
      # would hand prerelease code to consumers pinning that major version.
      - name: Update the floating major tag
        if: ${{ !contains(github.ref_name, '-') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          major_tag="${RELEASE_TAG%%.*}"
          release_sha="$(git rev-parse "$RELEASE_TAG^{commit}")"
          git config http.https://github.com/.extraheader "AUTHORIZATION: bearer $GH_TOKEN"
          git push --force origin "$release_sha:refs/tags/$major_tag"
