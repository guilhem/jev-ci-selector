name: Validate action
on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  schedule:
    - cron: '41 5 * * 1'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
  self-test:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load the local action
        id: select
        uses: ./
        with:
          mode: shadow
          api-key: ''
          allow-external-context: 'false'
          tasks: |
            validate:
              description: Verifies the TypeScript source, tests and committed bundle.
              jobs:
                - workflow: .github/workflows/ci.yml
                  job: validate
            self-test:
              description: Verifies the local action on a GitHub-hosted Node 24 runner.
              jobs:
                - workflow: .github/workflows/ci.yml
                  job: self-test
      - name: Assert local action outputs
        env:
          STATUS: ${{ steps.select.outputs.status }}
          HAS_TASKS: ${{ steps.select.outputs.has-tasks }}
          REPORT_PATH: ${{ steps.select.outputs.report-path }}
        run: |
          test "$STATUS" = bypassed
          test "$HAS_TASKS" = true
          test -s "$REPORT_PATH"
          node -e 'const report = require(process.argv[1]); if (report.version !== 8 || report.status !== "bypassed") process.exit(1)' "$REPORT_PATH"
  ci-required:
    if: ${{ always() }}
    needs:
      - validate
      - self-test
    runs-on: ubuntu-latest
    steps:
      - env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          SELF_TEST_RESULT: ${{ needs.self-test.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          test "$VALIDATION_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then
            test "$SELF_TEST_RESULT" = success
          else
            test "$SELF_TEST_RESULT" = skipped
          fi
