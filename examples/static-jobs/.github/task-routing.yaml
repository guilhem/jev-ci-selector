model: jev-1.13.0
skip_below: 0.05

# Changes to CI inputs are unsafe to select semantically. They run every job.
force_all_paths:
  - .github/**
  - ci/**
  - go.mod
  - go.sum

# Keep this catalog and the job IDs in ci.yml in lockstep. The integration
# validator rejects an omitted or newly unknown task.
tasks:
  build:
    description: Runs the compiled Go package checks.
    jobs:
      - workflow: .github/workflows/ci.yml
        job: build
    always: true
  e2e_network:
    description: Runs the network end-to-end checks.
    jobs:
      - workflow: .github/workflows/ci.yml
        job: e2e_network
  e2e_upgrade:
    description: Runs the upgrade path checks.
    jobs:
      - workflow: .github/workflows/ci.yml
        job: e2e_upgrade
  helm:
    description: Runs Helm chart validation.
    jobs:
      - workflow: .github/workflows/ci.yml
        job: helm
    force_paths:
      - charts/**/values.schema.json
  lint:
    description: Runs Go static-analysis checks.
    jobs:
      - workflow: .github/workflows/ci.yml
        job: lint
    always: true
  unit:
    description: Runs package behavior tests.
    jobs:
      - workflow: .github/workflows/ci.yml
        job: unit
    always: true
