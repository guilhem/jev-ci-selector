model: jev-1.13.0
skip_below: 0.05

force_all_paths:
  - .github/**
  - ci/**
  - go.mod
  - go.sum

# The matrix launcher has a fixed allowlist for these IDs. Keep it in sync
# with this catalog; the integration validator rejects drift.
tasks:
  build:
    description: Runs the compiled Go package checks.
    jobs:
      - workflow: .github/workflows/ci.yml
        job: tasks
  e2e_network:
    description: Runs the network end-to-end checks.
    jobs:
      - workflow: .github/workflows/ci.yml
        job: tasks
  e2e_upgrade:
    description: Runs the upgrade path checks.
    jobs:
      - workflow: .github/workflows/ci.yml
        job: tasks
  helm:
    description: Runs Helm chart validation.
    jobs:
      - workflow: .github/workflows/ci.yml
        job: tasks
    force_paths:
      - charts/**/values.schema.json
  lint:
    description: Runs Go static-analysis checks.
    jobs:
      - workflow: .github/workflows/ci.yml
        job: tasks
  unit:
    description: Runs package behavior tests.
    jobs:
      - workflow: .github/workflows/ci.yml
        job: tasks
